<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#080812;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <!-- Glow -->
  <ellipse cx="200" cy="160" rx="180" ry="160" fill="url(#glowGrad)"/>
  <!-- Person silhouette (stylized) -->
  <!-- Head -->
  <circle cx="200" cy="150" r="65" fill="#1e0e40" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Body -->
  <path d="M 110 380 Q 110 280 200 260 Q 290 280 290 380 Z" fill="#140a2a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Face highlight -->
  <circle cx="200" cy="148" r="48" fill="#251050" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="182" cy="140" r="6" fill="#a78bfa" opacity="0.7"/>
  <circle cx="218" cy="140" r="6" fill="#a78bfa" opacity="0.7"/>
  <!-- Circuit lines decoration -->
  <line x1="60" y1="200" x2="120" y2="200" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="120" y1="200" x2="120" y2="250" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="120" cy="250" r="3" fill="#a78bfa" opacity="0.6"/>
  <line x1="280" y1="150" x2="340" y2="150" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="280" y1="150" x2="280" y2="200" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="280" cy="200" r="3" fill="#818cf8" opacity="0.6"/>
  <!-- MK monogram -->
  <text x="200" y="360" font-family="sans-serif" font-size="14" font-weight="700" fill="#8b5cf6" text-anchor="middle" opacity="0.6">REPLACE WITH YOUR PHOTO</text>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>
</svg>
